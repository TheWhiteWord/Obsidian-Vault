name: obsidian-vault
version: 0.4.0
description: "Schema-driven, permission-enforced Obsidian vault engine. Config inheritance, grant enforcement, validated writes, generated indexes, scaffolding, self-describing config, deterministic graph + search."
author: TWW + Hermes
kind: backend
pip_dependencies:
  - python-frontmatter
  - PyYAML
provides_tools:
  - obsidian_context
  - obsidian_write
  - obsidian_edit_metadata
  - obsidian_delete
  - obsidian_scaffold
  - obsidian_edit_config
  - obsidian_index
  - obsidian_audit
  - obsidian_reference
  - obsidian_search
  - obsidian_graph
  - obsidian_issue
  - obsidian_issue_resolve
  - obsidian_issue_list
  - obsidian_maintain
