# */ISSUES — universal defect/request channel (spec §1.3).
# Policy for this tree only. The `issue` kind and its status lifecycle are
# NOT in the global kind list; they live here, so `issue` is a vault-specific
# value, not a global one. Anyone may append here (granted in roles.yaml).
fields:
  kind:
    required: true
    multi: true
    vocabulary: true
    allowed_only: [issue]
  status:
    required: true
    allowed_only: [open, in-progress, resolved]
  severity:
    required: false
    vocabulary: true
    allowed: [low, medium, high, critical]
  created:
    required: true
    format: date
  description:
    required: false
defaults:
  status: open
  created: "@today"
tags:
  mode: suggest
validation:
  fields: blocking
  tags: advisory
