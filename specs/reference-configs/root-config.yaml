# Vault v2 root config
# MECHANISM lives in the plugin; POLICY lives here. This file is one
# configuration of a general vault engine — trees, fields, and vocabularies
# are all chosen here, not assumed by the code.

fields:
  type:
    required: true
    vocabulary: true          # declared/observed lifecycle applies (§3.7)
    allowed: [index, note]
  kind:
    required: true
    multi: true
    vocabulary: true
    allowed: [note, index, reference]   # 'issue' is NOT global — it lives only in */ISSUES/ configs
  status:
    required: true
    allowed: [draft, active, paused, completed, reference]
  tags:
    required: true
    multi: true
  created:
    required: true
    format: date
  # Advisory one-line summary — surfaced in INDEX so notes are triageable
  # without opening them. Prompted by obsidian_context, never blocking.
  description:
    required: false

defaults:
  status: draft
  created: "@today"

tags:
  mode: suggest

validation:
  fields: blocking
  tags: advisory

# Where machine-written state goes (§6). Default is vault-root .state/ (dot-
# prefixed, reads as machinery); the engine creates it on first use — the
# manager (P4) depends on the trail.
paths:
  state: .state

# INDEX renders this field's value so notes are triageable without opening them
# (P2-addendum). The field name is policy; only the `summary_field` key is engine.
summary_field: description

vocabulary:
  promote_after_uses: 3
  promote_after_days: 14
